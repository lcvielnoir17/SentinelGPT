name: Scheduled Dependency Scan

# SRS Chapter 11, Section 10: pip-audit (or equivalent) also runs on a
# scheduled cadence against main, so newly-disclosed CVEs in an already-pinned
# dependency set are caught without waiting for a code change.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  pip-audit-scheduled:
    name: Nightly pip-audit against main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock --strict

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.lock --strict

      - name: Frontend audit (critical/high policy)
        run: |
          npm ci
          npm audit --audit-level=high
