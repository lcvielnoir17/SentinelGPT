[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelgpt"
version = "0.1.0"
description = "SentinelGPT: AI-Powered Vulnerability Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SentinelGPT Team" }
]
license = { text = "Proprietary / Research" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0,<1.0.0",
    "structlog>=24.2.0",
    "pyjwt>=2.8.0,<3.0.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0,<26.0.0",
    "email-validator>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.26.0,<2.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "hypothesis>=6.108.0",
    "types-redis>=4.6.0.20240425",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "tests"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "docs",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Unused fixture-request parameters are idiomatic pytest (ordering/scoping).
"tests/**" = ["ARG001"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic/FastAPI/SQLAlchemy resolve annotations at runtime — imports used in
# their models must stay runtime-visible.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend:backend/src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "^docs/",
    "^.venv/",
]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend", "backend/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises real local runtime capabilities (docker, OS resolver); auto-skips when unavailable",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
